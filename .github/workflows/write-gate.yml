# The ops write gate (docs/ops/system.md#write-gate, ops plan S4).
#
# Runs on pull_request_target, so GitHub always uses main's copy of this file and of the scripts it
# runs: a pull request can't change what judges it. SAFETY: this job checks out MAIN ONLY and reads
# the pull request through the API, as data. Never check out, install or run the PR's code here;
# with pull_request_target that code would run with this job's write token.
#
# It stamps `backfill/approved` when the owner adds `owner-approved`, classifies the PR
# (write:docs / write:code / write:migration / write:insert-auto), and sets the `write-gate`
# status that main's ruleset requires.
name: write-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # Records who moved the head ("<login> (<type>)") as the write-gate/pusher status, so the gate's
  # owner-authored path can require that the owner pushed it. Never queued, so never dropped.
  record-pusher:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Record the pusher on the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: gh api -X POST "repos/$REPO/statuses/$SHA" -f context=write-gate/pusher -f state=success -f "description=$SENDER ($SENDER_TYPE)"

  gate:
    needs: record-pusher
    # Run even when record-pusher was skipped (label events) or failed; without a recorded pusher
    # the owner-authored path simply doesn't apply.
    if: always()
    # One gate run per PR at a time, in order, so an older run can't overwrite a newer verdict. If a
    # label's run is dropped from the queue, its stamp is never written: re-add the label.
    concurrency:
      group: write-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # main's dependencies; no install scripts are needed to run the gate.
      - run: npm ci --ignore-scripts

      - name: Stamp, classify and evaluate
        run: npx tsx scripts/ci/write-gate-run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Must equal the default in src/lib/backfill/approval-stamp.ts (write-gate.test.ts checks it).
          OWNER_GITHUB_LOGIN: johnrclem
          AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
