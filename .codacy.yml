# Prisma migration SQL is generated by `prisma migrate` and is checksum-locked
# once applied — we cannot edit existing files without breaking deploys.
# Codacy's SQL checks (e.g. `SET QUOTED_IDENTIFIER ON`) are SQL Server / T-SQL
# conventions that don't apply to PostgreSQL, so they're false positives here.
#
# Test files feed hand-crafted HTML fixtures to `cheerio.load()` / `mockFetch()`
# as their primary purpose. Codacy's security/detect-non-literal-html-method
# flags every such call as a potential XSS sink even though the input is a
# const literal under our control. Per-line suppressions trip SonarCloud's
# S7724 "Specify the rules you want to disable" (we can't name an unknown
# rule without breaking local ESLint). Excluding tests entirely is the
# cleaner trade-off — production code is still fully covered.
#
# scripts/lib/audit-shared.ts is the dated-report writer for the local-only
# audit scripts. Codacy's security/detect-non-literal-fs-filename flags its
# fs.writeFileSync/mkdirSync calls, but the path is a fixed repo-relative dir
# (docs/audits) + a basename built from our own clock — never user input. Same
# inline-suppression limitation as above, so we exclude the single helper file.
#
# scripts/ci/check-backfill-manifest.ts is the backfill-manifest CI job. Its fs
# calls (detect-non-literal-fs-filename) read paths from git's own changed-file
# list in CI's checkout, each matched first against ARCHIVE_PATH_RE or
# MIGRATION_FILE_RE, and append to the runner's GITHUB_STEP_SUMMARY; its one
# object-injection hit indexes the manifest by a fixed list of field names.
# Same inline-suppression limitation as above, so the single file is excluded.
exclude_paths:
  - "prisma/migrations/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "scripts/lib/audit-shared.ts"
  - "scripts/ci/check-backfill-manifest.ts"
